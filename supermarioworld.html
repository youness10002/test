<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LIAVG Super Mario World Leaderboard</title>
    
    <!-- Importation d'une police Pixel Art Google Fonts -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com" rel="stylesheet">

    <style type="text/css">
        body {
            background-color: #0b0314;
            color: #fff;
            font-family: 'Press Start 2P', monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            background-image: radial-gradient(circle, #1a082e 0%, #22897e 100%);
        }

        h1 {
            color: #00ffff;
            font-size: 24px;
            text-transform: uppercase;
            text-align: center;
            margin-bottom: 40px;
            text-shadow: 0 0 10px #00ffff, 0 0 20px #00ffff, 0 0 30px #00ffff;
            animation: flicker 2s infinite alternate;
        }

        .arcade-container {
            border: 4px solid #ff007f;
            padding: 30px;
            background: rgba(11, 3, 20, 0.85);
            border-radius: 10px;
            box-shadow: 0 0 20px #ff007f, inset 0 0 15px rgba(255, 0, 127, 0.5);
            min-width: 550px;
        }

        /* Application de vos styles sur la table générée dynamiquement par Dreamlo */
        .dreamloLBTable { 
            border-collapse: separate;
            border-spacing: 0 10px; 
            text-align: center;
            width: 100%;
            max-width: 650px; 
            font-size: 12px;
            letter-spacing: 1px;
        }

        .dreamloLBTable th { 
            color: #ffff00; 
            border-bottom: 3px dashed #ffff00;
            font-weight: bold;
            text-transform: uppercase;
            padding: 15px; 
            text-shadow: 0 0 5px #ffff00;
        }

        .dreamloLBTable td { 
            background: rgba(255, 255, 255, 0.03);
            border-top: 2px solid #3d105a;
            border-bottom: 2px solid #3d105a;
            padding: 20px; 
            color: #00ff66; 
            text-shadow: 0 0 5px rgba(0, 255, 102, 0.5);
            transition: all 0.3s ease;
        }

        .dreamloLBTable td:first-child {
            border-left: 2px solid #3d105a;
            border-top-left-radius: 4px;
            border-bottom-left-radius: 4px;
            color: #ff007f; 
            text-shadow: 0 0 5px rgba(255, 0, 127, 0.5);
        }

        .dreamloLBTable td:last-child {
            border-right: 2px solid #3d105a;
            border-top-right-radius: 4px;
            border-bottom-right-radius: 4px;
        }

        .dreamloLBTable tr:hover td {
            background: rgba(0, 255, 255, 0.1);
            color: #ffffff;
            text-shadow: 0 0 8px #00ffff;
            cursor: pointer;
        }

        @keyframes flicker {
            0%, 19%, 21%, 23%, 25%, 54%, 56%, 100% { text-shadow: 0 0 10px #00ffff, 0 0 20px #00ffff, 0 0 30px #00ffff; }
            20%, 24%, 55% { text-shadow: none; color: #004444; }
        }
    </style>
</head>
<body>

    <h1>🏆 High Scores 🏆</h1>

    <div class="arcade-container" id="leaderboard-container">
        <!-- APPEL NATIF DU SCRIPT : Dreamlo génère le tableau HTML ici automatiquement -->
        <script src="supermarioworld.js" type="text/javascript"></script>
    </div>

    <script type="text/javascript">
        function formatExistingTable() {
            // On récupère la table générée par votre script Dreamlo d'origine
            let table = document.querySelector(".dreamloLBTable");
            if (!table) return;

            // 1. AJOUT DE L'EN-TÊTE HORIZONTALE "TEMPS" SI ABSENTE
            let headerRow = table.querySelector("tr");
            if (headerRow) {
                let ths = headerRow.getElementsByTagName("th");
                // Si Dreamlo n'a créé que Position, Nom, Score (3 colonnes)
                if (ths.length === 3) {
                    let newTh = document.createElement("th");
                    newTh.innerText = "TEMPS";
                    headerRow.appendChild(newTh);
                }
            }

            // 2. CONVERSION DES CELLULES DE TEMPS EN MM:SS
            let rows = table.querySelectorAll("tr");
            rows.forEach((row, index) => {
                if (index === 0) return; // On ignore les en-têtes

                let cells = row.getElementsByTagName("td");
                
                // Si la ligne contient bien la colonne des secondes (3ème ou 4ème index selon l'export Dreamlo)
                if (cells.length >= 3) {
                    // Cible la cellule du temps (généralement la dernière de la ligne générée)
                    let targetCell = cells[cells.length - 1]; 
                    let totalSeconds = parseInt(targetCell.innerText || targetCell.textContent, 10);

                    if (!isNaN(totalSeconds)) {
                        let hours = Math.floor(totalSeconds / 3600);
                        let minutes = Math.floor((totalSeconds % 3600) / 60);
                        let seconds = totalSeconds % 60;

                        let formattedTime = "";
                        if (hours > 0) {
                            let hh = hours < 10 ? "0" + hours : hours;
                            let mm = minutes < 10 ? "0" + minutes : minutes;
                            let ss = seconds < 10 ? "0" + seconds : seconds;
                            formattedTime = hh + ":" + mm + ":" + ss;
                        } else {
                            let mm = minutes < 10 ? "0" + minutes : minutes;
                            let ss = seconds < 10 ? "0" + seconds : seconds;
                            formattedTime = mm + ":" + ss;
                        }

                        // On écrase le nombre brut par la version horloge
                        targetCell.innerText = formattedTime;
                    }
                }
            });
        }

        // Exécution sécurisée après injection complète de la table Dreamlo dans la page
        window.addEventListener("load", () => {
            setTimeout(formatExistingTable, 500);
        });
    </script>
</body>
</html>
