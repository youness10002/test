<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LIAVG Super Mario World Leaderboard</title>
    
    <!-- Importation d'une police Pixel Art Google Fonts -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com" rel="stylesheet">

    <style type="text/css">
        body {
            background-color: #0b0314;
            color: #fff;
            font-family: 'Press Start 2P', monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            background-image: radial-gradient(circle, #1a082e 0%, #22897e 100%);
        }

        h1 {
            color: #00ffff;
            font-size: 24px;
            text-transform: uppercase;
            text-align: center;
            margin-bottom: 40px;
            text-shadow: 0 0 10px #00ffff, 0 0 20px #00ffff, 0 0 30px #00ffff;
            animation: flicker 2s infinite alternate;
        }

        .arcade-container {
            border: 4px solid #ff007f;
            padding: 30px;
            background: rgba(11, 3, 20, 0.85);
            border-radius: 10px;
            box-shadow: 0 0 20px #ff007f, inset 0 0 15px rgba(255, 0, 127, 0.5);
            min-width: 550px;
        }

        /* Application de vos styles sur la table générée dynamiquement par Dreamlo */
        .dreamloLBTable { 
            border-collapse: separate;
            border-spacing: 0 10px; 
            text-align: center;
            width: 100%;
            max-width: 650px; 
            font-size: 12px;
            letter-spacing: 1px;
        }

        .dreamloLBTable th { 
            color: #ffff00; 
            border-bottom: 3px dashed #ffff00;
            font-weight: bold;
            text-transform: uppercase;
            padding: 15px; 
            text-shadow: 0 0 5px #ffff00;
        }

        .dreamloLBTable td { 
            background: rgba(255, 255, 255, 0.03);
            border-top: 2px solid #3d105a;
            border-bottom: 2px solid #3d105a;
            padding: 20px; 
            color: #00ff66; 
            text-shadow: 0 0 5px rgba(0, 255, 102, 0.5);
            transition: all 0.3s ease;
        }

        /* La toute première colonne (Position injectée) prend la couleur rose flashy */
        .dreamloLBTable td:first-child {
            border-left: 2px solid #3d105a;
            border-top-left-radius: 4px;
            border-bottom-left-radius: 4px;
            color: #ff007f; 
            text-shadow: 0 0 5px rgba(255, 0, 127, 0.5);
        }

        .dreamloLBTable td:last-child {
            border-right: 2px solid #3d105a;
            border-top-right-radius: 4px;
            border-bottom-right-radius: 4px;
        }

        .dreamloLBTable tr:hover td {
            background: rgba(0, 255, 255, 0.1);
            color: #ffffff;
            text-shadow: 0 0 8px #00ffff;
            cursor: pointer;
        }

        @keyframes flicker { 
            0%, 19%, 21%, 23%, 25%, 54%, 56%, 100% { text-shadow: 0 0 10px #00ffff, 0 0 20px #00ffff, 0 0 30px #00ffff; }
            20%, 24%, 55% { text-shadow: none; color: #004444; } 
        }
    </style>
</head>
<body>

    <h1>🏆 High Scores 🏆</h1>

    <div class="arcade-container" id="leaderboard-container">
        <!-- Le script Dreamlo d'origine qui injecte la table de base -->
        <script src="supermarioworld.js" type="text/javascript"></script>
        <script type="text/javascript">
    function ajouterColonnePosition() {
        // On cible le tableau généré par Dreamlo
        let table = document.querySelector(".dreamloLBTable");
        if (!table) return;

        let rows = table.querySelectorAll("tr");
        
        rows.forEach((row, index) => {
            // Sécurité anti-doublon : si la colonne POS est déjà là, on ne fait rien
            if (row.getAttribute("data-pos-added") === "true") return;

            if (index === 0) {
                // 1. Sur la ligne des titres : on ajoute l'en-tête "POS" tout à gauche
                let thPos = document.createElement("th");
                thPos.innerText = "POS";
                row.insertBefore(thPos, row.firstChild);
            } else {
                // 2. Sur les lignes de joueurs : on ajoute le numéro (1, 2, 3...) tout à gauche
                let tdPos = document.createElement("td");
                tdPos.innerText = index;
                row.insertBefore(tdPos, row.firstChild);
            }

            // On marque la ligne comme traitée
            row.setAttribute("data-pos-added", "true");
        });
    }

    // On exécute le script 500ms après le chargement pour laisser le temps à Dreamlo d'écrire son tableau
    window.addEventListener("load", () => {
        setTimeout(ajouterColonnePosition, 500);
    });
</script>

    </div>
    
</body>
</html>
