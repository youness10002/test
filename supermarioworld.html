<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LIAVG Super Mario World Leaderboard</title>
    
    <!-- Importation d'une police Pixel Art Google Fonts -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

    <style type="text/css">
        /* Fond d'écran style salle d'arcade sombre 0b0314 05010a*/
        /*#0f001e #22897e*/
        body {
            background-color: #0b0314;
            color: #fff;
            font-family: 'Press Start 2P', monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            background-image: radial-gradient(circle, #1a082e 0%, #22897e 100%);
        }

        /* Titre principal style néon clignotant */
        h1 {
            color: #00ffff;
            font-size: 24px;
            text-transform: uppercase;
            text-align: center;
            margin-bottom: 40px;
            text-shadow: 0 0 10px #00ffff, 0 0 20px #00ffff, 0 0 30px #00ffff;
            animation: flicker 2s infinite alternate;
        }

        /* Conteneur de la borne d'arcade */
        .arcade-container {
            border: 4px solid #ff007f;
            padding: 30px;
            background: rgba(11, 3, 20, 0.85);
            border-radius: 10px;
            box-shadow: 0 0 20px #ff007f, inset 0 0 15px rgba(255, 0, 127, 0.5);
        }

        /* Le Tableau Dreamlo */
        .dreamloLBTable { 
            border-collapse: separate;
            border-spacing: 0 10px; /* Espace entre les lignes */
            text-align: center;
            width: 100%;
            max-width: 650px; 
            font-size: 12px;
            letter-spacing: 1px;
        }

        /* En-tête du tableau (Colonnes) */
        .dreamloLBTable th { 
            color: #ffff00; /* Jaune rétro */
            border-bottom: 3px dashed #ffff00;
            font-weight: bold;
            text-transform: uppercase;
            padding: 15px; 
            text-shadow: 0 0 5px #ffff00;
        }

        /* Lignes du tableau (Joueurs et scores) */
        .dreamloLBTable td { 
            background: rgba(255, 255, 255, 0.03);
            border-top: 2px solid #3d105a;
            border-bottom: 2px solid #3d105a;
            padding: 20px; 
            color: #00ff66; /* Vert matrice/arcade */
            text-shadow: 0 0 5px rgba(0, 255, 102, 0.5);
            transition: all 0.3s ease;
        }

        /* Bordures intérieures gauche/droite pour simuler des cases */
        .dreamloLBTable td:first-child {
            border-left: 2px solid #3d105a;
            border-top-left-radius: 4px;
            border-bottom-left-radius: 4px;
            color: #ff007f; /* Rang/Pseudo en rose flashy */
            text-shadow: 0 0 5px rgba(255, 0, 127, 0.5);
        }

        .dreamloLBTable td:last-child {
            border-right: 2px solid #3d105a;
            border-top-right-radius: 4px;
            border-bottom-right-radius: 4px;
        }

        /* Effet au survol d'une ligne */
        .dreamloLBTable tr:hover td {
            background: rgba(0, 255, 255, 0.1);
            color: #ffffff;
            text-shadow: 0 0 8px #00ffff;
            cursor: pointer;
        }

        /* Animation pour l'effet néon du titre */
        @keyframes flicker {
            0%, 19%, 21%, 23%, 25%, 54%, 56%, 100% {
                text-shadow: 0 0 10px #00ffff, 0 0 20px #00ffff, 0 0 30px #00ffff;
            }
            20%, 24%, 55% {        
                text-shadow: none;
                color: #004444;
            }
        }
    </style>
</head>
<body>

    <h1>🏆 High Scores 🏆</h1>

    <div class="arcade-container" id="leaderboard-wrapper">
        <!-- Le script Dreamlo va générer sa table ".dreamloLBTable" automatiquement ici -->
        <script src="supermarioworld.js" type="text/javascript"></script>
    </div>

    <!-- Script de formatage intelligent du temps (Secondes -> HH:MM:SS ou MM:SS) -->
    <script type="text/javascript">
        function reformatDreamloTimer() {
            // Sélectionne toutes les lignes de données générées par la table Dreamlo
            let rows = document.querySelectorAll(".dreamloLBTable tr");
            
            rows.forEach((row, index) => {
                // On ignore la première ligne (index 0) qui correspond aux en-têtes du tableau
                if (index === 0) return;

                let cells = row.getElementsByTagName("td");
                // La structure standard de Dreamlo génère : [Rang/Nom, Score, Secondes, Date...]
                // Les secondes brutes se trouvent généralement dans la 3ème colonne (index 2)
                if (cells.length >= 3) {
                    let timerCell = cells[2];
                    let totalSeconds = parseInt(timerCell.innerText || timerCell.textContent, 10);

                    if (!isNaN(totalSeconds)) {
                        let hours = Math.floor(totalSeconds / 3600);
                        let minutes = Math.floor((totalSeconds % 3600) / 60);
                        let seconds = totalSeconds % 60;

                        let formattedTime = "";

                        // Formatage intelligent en fonction de la durée détectée
                        if (hours > 0) {
                            // Si le temps dépasse une heure, on affiche HH:MM:SS
                            let hh = hours < 10 ? "0" + hours : hours;
                            let mm = minutes < 10 ? "0" + minutes : minutes;
                            let ss = seconds < 10 ? "0" + seconds : seconds;
                            formattedTime = hh + ":" + mm + ":" + ss;
                        } else {
                            // Sinon, affichage standard sur deux chiffres MM:SS
                            let mm = minutes < 10 ? "0" + minutes : minutes;
                            let ss = seconds < 10 ? "0" + seconds : seconds;
                            formattedTime = mm + ":" + ss;
                        }

                        // Remplacement de la valeur brute par la version horloge pixel art
                        timerCell.innerText = formattedTime;
                    }
                }
            });
        }

        // On attend que la page et le script externe de GitHub / Dreamlo soient entièrement chargés
        window.addEventListener("load", () => {
            // Un léger délai de 500ms garantit que la table HTML est bien injectée dans le DOM avant de la modifier
            setTimeout(reformatDreamloTimer, 500);
        });
    </script>

</body>
</html>
