<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LIAVG Super Mario World Leaderboard</title>
    
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com" rel="stylesheet">

    <style type="text/css">
        body {
            background-color: #0b0314;
            color: #fff;
            font-family: 'Press Start 2P', monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            background-image: radial-gradient(circle, #1a082e 0%, #22897e 100%);
        }

        h1 {
            color: #00ffff;
            font-size: 24px;
            text-transform: uppercase;
            text-align: center;
            margin-bottom: 40px;
            text-shadow: 0 0 10px #00ffff, 0 0 20px #00ffff, 0 0 30px #00ffff;
            animation: flicker 2s infinite alternate;
        }

        .arcade-container {
            border: 4px solid #ff007f;
            padding: 30px;
            background: rgba(11, 3, 20, 0.85);
            border-radius: 10px;
            box-shadow: 0 0 20px #ff007f, inset 0 0 15px rgba(255, 0, 127, 0.5);
            min-width: 500px;
        }

        .dreamloLBTable { 
            border-collapse: separate;
            border-spacing: 0 10px; 
            text-align: center;
            width: 100%;
            max-width: 650px; 
            font-size: 12px;
            letter-spacing: 1px;
        }

        .dreamloLBTable th { 
            color: #ffff00; 
            border-bottom: 3px dashed #ffff00;
            font-weight: bold;
            text-transform: uppercase;
            padding: 15px; 
            text-shadow: 0 0 5px #ffff00;
        }

        .dreamloLBTable td { 
            background: rgba(255, 255, 255, 0.03);
            border-top: 2px solid #3d105a;
            border-bottom: 2px solid #3d105a;
            padding: 20px; 
            color: #00ff66; 
            text-shadow: 0 0 5px rgba(0, 255, 102, 0.5);
            transition: all 0.3s ease;
        }

        .dreamloLBTable td:first-child {
            border-left: 2px solid #3d105a;
            border-top-left-radius: 4px;
            border-bottom-left-radius: 4px;
            color: #ff007f; 
            text-shadow: 0 0 5px rgba(255, 0, 127, 0.5);
        }

        .dreamloLBTable td:last-child {
            border-right: 2px solid #3d105a;
            border-top-right-radius: 4px;
            border-bottom-right-radius: 4px;
        }

        .dreamloLBTable tr:hover td {
            background: rgba(0, 255, 255, 0.1);
            color: #ffffff;
            text-shadow: 0 0 8px #00ffff;
            cursor: pointer;
        }

        @keyframes flicker {
            0%, 19%, 21%, 23%, 25%, 54%, 56%, 100% {
                text-shadow: 0 0 10px #00ffff, 0 0 20px #00ffff, 0 0 30px #00ffff;
            }
            20%, 24%, 55% {        
                text-shadow: none;
                color: #004444;
            }
        }
    </style>
</head>
<body>

    <h1>🏆 High Scores 🏆</h1>

    <div class="arcade-container">
        <table class="dreamloLBTable" id="leaderboard-table">
            <thead>
                <tr>
                    <th>Pos</th>
                    <th>Joueur</th>
                    <th>Score</th>
                    <th>Temps</th>
                </tr>
            </thead>
            <tbody id="leaderboard-body">
                <!-- Les lignes de scores seront générées ici par le script -->
                <tr><td colspan="4" style="color: #ffff00;">Chargement des scores...</td></tr>
            </tbody>
        </table>
    </div>

    <script type="text/javascript">
        async function loadLeaderboard() {
            try {
                // Récupère le fichier JSON mis à jour par votre C# sur GitHub
                // Note : Ajustez le nom du fichier si vous gardez .js ou passez en .json (.js fonctionne aussi si c'est du JSON dedans)
                const response = await fetch('supermarioworld.js');
                if (!response.ok) throw new Error("Fichier introuvable");
                
                const data = await response.json();
                const tbody = document.getElementById('leaderboard-body');
                tbody.innerHTML = ""; // On vide le message de chargement

                // Extraction de la liste des entrées dreamlo
                let entries = [];
                if (data.dreamlo && data.dreamlo.leaderboard && data.dreamlo.leaderboard.entry) {
                    let entryData = data.dreamlo.leaderboard.entry;
                    entries = Array.isArray(entryData) ? entryData : [entryData];
                }

                if (entries.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="4">Aucun score disponible</td></tr>';
                    return;
                }

                // Génération des lignes du tableau
                entries.forEach((entry, index) => {
                    let tr = document.createElement('tr');

                    // 1. Position / Rang
                    let tdPos = document.createElement('td');
                    tdPos.innerText = (index + 1);
                    tr.appendChild(tdPos);

                    // 2. Pseudo du joueur
                    let tdName = document.createElement('td');
                    tdName.innerText = entry.name;
                    tr.appendChild(tdName);

                    // 3. Score principal
                    let tdScore = document.createElement('td');
                    tdScore.innerText = entry.score;
                    tr.appendChild(tdScore);

                    // 4. Conversion et formatage des secondes (champ "seconds" ou "text" dans l'API JSON dreamlo)
                    let tdTime = document.createElement('td');
                    let totalSeconds = parseInt(entry.seconds || entry.text, 10) || 0;
                    
                    let hours = Math.floor(totalSeconds / 3600);
                    let minutes = Math.floor((totalSeconds % 3600) / 60);
                    let seconds = totalSeconds % 60;

                    let formattedTime = "";
                    if (hours > 0) {
                        let hh = hours < 10 ? "0" + hours : hours;
                        let mm = minutes < 10 ? "0" + minutes : minutes;
                        let ss = seconds < 10 ? "0" + seconds : seconds;
                        formattedTime = hh + ":" + mm + ":" + ss;
                    } else {
                        let mm = minutes < 10 ? "0" + minutes : minutes;
                        let ss = seconds < 10 ? "0" + seconds : seconds;
                        formattedTime = mm + ":" + ss;
                    }

                    tdTime.innerText = formattedTime;
                    tr.appendChild(tdTime);

                    tbody.appendChild(tr);
                });

            } catch (error) {
                console.error(error);
                document.getElementById('leaderboard-body').innerHTML = '<tr><td colspan="4" style="color:#ff007f;">Erreur de synchronisation</td></tr>';
            }
        }

        // Lancement immédiat au chargement de la page
        window.addEventListener("DOMContentLoaded", loadLeaderboard);
    </script>

</body>
</html>
