    <script type="text/javascript">
        async function loadLeaderboard() {
            try {
                // Lecture du fichier brut sur GitHub avec destruction du cache
                const response = await fetch('supermarioworld.js?t=' + new Date().getTime());
                if (!response.ok) throw new Error("Fichier introuvable");
                
                const textData = await response.text();
                const tbody = document.getElementById('leaderboard-body');
                tbody.innerHTML = ""; 

                // Découpe le fichier ligne par ligne
                let lines = textData.split('\n').filter(line => line.trim() !== "");

                if (lines.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="4">Aucun score disponible</td></tr>';
                    return;
                }

                lines.forEach((line, index) => {
                    // Structure brute Pipe de Dreamlo : Pseudo|Score|Secondes|Date
                    let parts = line.split('|');
                    
                    if (parts.length >= 3) {
                        let tr = document.createElement('tr');

                        // 1. Position / Rang
                        let tdPos = document.createElement('td');
                        tdPos.innerText = (index + 1);
                        tr.appendChild(tdPos);

                        // 2. Joueur (Index 0)
                        let tdName = document.createElement('td');
                        tdName.innerText = parts[0];
                        tr.appendChild(tdName);

                        // 3. Score (Index 1)
                        let tdScore = document.createElement('td');
                        tdScore.innerText = parts[1];
                        tr.appendChild(tdScore);

                        // 4. Temps en secondes (Index 2)
                        let tdTime = document.createElement('td');
                        let totalSeconds = parseInt(parts[2], 10) || 0;
                        
                        let hours = Math.floor(totalSeconds / 3600);
                        let minutes = Math.floor((totalSeconds % 3600) / 60);
                        let seconds = totalSeconds % 60;

                        let formattedTime = "";
                        if (hours > 0) {
                            let hh = hours < 10 ? "0" + hours : hours;
                            let mm = minutes < 10 ? "0" + minutes : minutes;
                            let ss = seconds < 10 ? "0" + seconds : seconds;
                            formattedTime = hh + ":" + mm + ":" + ss;
                        } else {
                            let mm = minutes < 10 ? "0" + minutes : minutes;
                            let ss = seconds < 10 ? "0" + seconds : seconds;
                            formattedTime = mm + ":" + ss;
                        }

                        tdTime.innerText = formattedTime;
                        tr.appendChild(tdTime);

                        tbody.appendChild(tr);
                    }
                });

            } catch (error) {
                console.error(error);
                document.getElementById('leaderboard-body').innerHTML = '<tr><td colspan="4" style="color:#ff007f;">Erreur de chargement</td></tr>';
            }
        }

        window.addEventListener("DOMContentLoaded", loadLeaderboard);
    </script>
